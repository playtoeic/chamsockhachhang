# Triển khai: một bản ứng dụng + PostgreSQL, sau một reverse proxy HTTPS (ví dụ Caddy, Nginx).
# Dùng: cp .env.example .env.production (điền giá trị thật), rồi
#       docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/inbox
      ENABLE_SIMULATOR: "false"
      UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # Chạy đúng một bản: bộ phát sự kiện và tác vụ mỗi phút nằm trong tiến trình (plan.md).
    deploy:
      replicas: 1

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  pgdata:
