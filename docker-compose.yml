# Cơ sở dữ liệu cho phát triển cục bộ khi máy có Docker.
# Máy không có Docker: chạy `npm run db:local` (PostgreSQL nhúng, cùng cổng và cùng tên cơ sở dữ liệu).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inbox
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
